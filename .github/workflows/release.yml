name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tetris-blitz-toolkit-windows
            sep: ";"
          - os: macos-latest
            artifact: tetris-blitz-toolkit-macos
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build binary
        shell: bash
        run: |
          S='${{ matrix.sep }}'
          pyinstaller --noconfirm --windowed --name tetris-blitz-toolkit \
            --collect-all keystone --collect-all lief \
            --add-data "mosaic_symbols.json${S}." \
            --add-data "native_patches.json${S}." \
            --add-data "semantics.json${S}." \
            --add-data "apkbuilder${S}apkbuilder" \
            tb_editor.py
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" "tetris-blitz-toolkit.exe" || 7z a "../${{ matrix.artifact }}.zip" "tetris-blitz-toolkit"
          else
            zip -r "../${{ matrix.artifact }}.zip" "tetris-blitz-toolkit.app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: publish release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source archive (tool code only — no EA assets)
        run: git archive --format=zip --prefix=tetris-blitz-toolkit/ -o tetris-blitz-toolkit-source.zip HEAD
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tetris-blitz-toolkit-source.zip
            artifacts/**/*.zip
